<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Intel | Analytics</title>
    <!-- Tailwind for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body class="p-8">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-white">Domain Intelligence</h1>
                <p class="text-slate-400">Tracking the growth and liveness of the threat dataset.</p>
            </div>
            <div class="text-right">
                <p id="last-updated" class="text-sm text-slate-500">Updated: Loading...</p>
            </div>
        </div>

        <!-- Key Metrics -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="card p-6 rounded-xl">
                <p class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Total Probe Size</p>
                <div class="flex items-end mt-2">
                    <h2 id="total-count" class="text-3xl font-bold text-white">...</h2>
                </div>
            </div>
            <div class="card p-6 rounded-xl border-emerald-900/50 bg-emerald-900/10">
                <p class="text-sm font-semibold text-emerald-400 uppercase tracking-wider">Live Threats</p>
                <div class="flex items-end mt-2">
                    <h2 id="live-count" class="text-3xl font-bold text-emerald-300">...</h2>
                    <span id="live-percent" class="ml-2 text-sm text-emerald-500 mb-1">...</span>
                </div>
                <p class="text-xs text-emerald-600/70 mt-1">Responding to HTTP or Mail</p>
            </div>
            <div class="card p-6 rounded-xl border-slate-700/50 bg-slate-800/50">
                <p class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Dead / Inactive</p>
                <div class="flex items-end mt-2">
                    <h2 id="dead-count" class="text-3xl font-bold text-slate-500">...</h2>
                </div>
            </div>
        </div>

        <!-- Main Chart -->
        <div class="card p-6 rounded-xl">
            <h3 class="text-lg font-semibold text-white mb-4">Growth History</h3>
            <div class="relative h-96 w-full">
                <canvas id="growthChart"></canvas>
            </div>
        </div>

    </div>

    <script>
        async function loadData() {
            try {
                // Fetch the JSON generated by our python script
                const response = await fetch('history.json');
                const data = await response.json();

                if (!data || data.length === 0) return;

                // Get latest entry
                const latest = data[data.length - 1];
                
                // Update DOM
                document.getElementById('last-updated').innerText = `Data as of: ${latest.date}`;
                document.getElementById('total-count').innerText = latest.total.toLocaleString();
                document.getElementById('live-count').innerText = latest.live.toLocaleString();
                document.getElementById('dead-count').innerText = latest.dead.toLocaleString();
                
                const percent = ((latest.live / latest.total) * 100).toFixed(1);
                document.getElementById('live-percent').innerText = `(${percent}%)`;

                // Prepare Chart Data
                const dates = data.map(d => d.date);
                const total = data.map(d => d.total);
                const live = data.map(d => d.live);

                renderChart(dates, total, live);

            } catch (error) {
                console.error("Failed to load history data:", error);
            }
        }

        function renderChart(dates, total, live) {
            const ctx = document.getElementById('growthChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [
                        {
                            label: 'Total Domains',
                            data: total,
                            borderColor: '#94a3b8', // Slate-400
                            backgroundColor: 'rgba(148, 163, 184, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        },
                        {
                            label: 'Live Threats',
                            data: live,
                            borderColor: '#10b981', // Emerald-500
                            backgroundColor: 'rgba(16, 185, 129, 0.2)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#cbd5e1' }
                        }
                    },
                    scales: {
                        y: {
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    }
                }
            });
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
