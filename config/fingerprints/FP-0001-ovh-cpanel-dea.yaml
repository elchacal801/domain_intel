id: "FP-0001"
name: "OVH cPanel DEA Infrastructure"
description: >
  Bulk DEA domains on OVH (ASN 16276) using cprapid.com nameservers
  and temp-mail-pro.com MX.
version: 1

indicators:
  - field: asn
    match_type: exact
    value: "16276"
    required: true
  - field: ns
    match_type: contains
    value: "cprapid.com"
    required: true
  - field: mx
    match_type: contains
    value: "temp-mail-pro.com"
    required: false

confidence_base: 70

confidence_modifiers:
  - field: mx
    match_type: contains
    value: "temp-mail-pro.com"
    delta: 15
  - field: cc
    match_type: exact
    value: "FR"
    delta: 10
  - field: gleif_status
    match_type: exact
    value: "ACTIVE"
    delta: -15
  - field: gleif_lei
    match_type: exact
    value: ""
    delta: 10
  - field: os_match_score
    match_type: range
    value: "70-100"
    delta: 20
  - field: icij_entity_match
    match_type: exact
    value: "True"
    delta: 15
  - field: vt_malicious_count
    match_type: range
    value: "3-100"
    delta: 20
  - field: phishtank_match
    match_type: exact
    value: "True"
    delta: 15
  - field: st_registrar_changes
    match_type: range
    value: "3-100"
    delta: 10
  - field: st_dns_history_count
    match_type: range
    value: "10-1000"
    delta: 5

flame_tp_ids:
  - "TP-0003"

ttl_days: 30
