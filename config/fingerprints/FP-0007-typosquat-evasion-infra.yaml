id: "FP-0007"
name: "Typosquat Evasion Infrastructure"
description: >
  Domains flagged as typosquats that redirect (301/302) and maintain
  active MX, indicating operational evasion infrastructure rather than
  parked domains.
version: 1

indicators:
  - field: risk_tags
    match_type: contains
    value: "typosquat"
    required: true
  - field: http_status
    match_type: regex
    value: "^3\\d\\d$"
    required: true
  - field: mx
    match_type: contains
    value: "."
    required: true

confidence_base: 75

confidence_modifiers:
  - field: gleif_status
    match_type: exact
    value: "ACTIVE"
    delta: -15
  - field: gleif_lei
    match_type: exact
    value: ""
    delta: 10
  - field: os_match_score
    match_type: range
    value: "70-100"
    delta: 20
  - field: icij_entity_match
    match_type: exact
    value: "True"
    delta: 15

flame_tp_ids:
  - "TP-0012"

ttl_days: 30
