id: "FP-0008"
name: "pickelhost/eye-mail ULA SPF Phishing Platform"
description: >
  Domains using any of 18+ confirmed actor-operated disposable email services as MX,
  typically with ULA IPv6 SPF records (fd00::/8 range). This fingerprint identifies
  a large-scale phishing-as-a-service operation with 40+ mail server IPs, 200K+
  estimated domains, targeting US military, defense contractors, financial services,
  insurance companies, and tech brands. Connected to the Okta-reported vishing
  campaign (Jan 2026). Investigation origin: FS-ISAC (mysecurepasskey.com, Apr 2026).
version: 2

# No AND-gated indicators: this fingerprint is gated purely by any_of.
indicators: []

any_of:
  # OR semantics: at least one of these must match. Previously these
  # were indicators with required:false, which made the fingerprint
  # match every row -- the engine had no OR until any_of was added.
  - field: primary_mx
    match_type: contains
    value: "pickelhost.com"
  - field: primary_mx
    match_type: contains
    value: "eye-mail.net"
  - field: primary_mx
    match_type: contains
    value: "h-email.net"
  - field: primary_mx
    match_type: contains
    value: "happyisp.com"
  - field: primary_mx
    match_type: contains
    value: "hope-mail.com"
  - field: primary_mx
    match_type: contains
    value: "mailerhost.net"
  - field: primary_mx
    match_type: contains
    value: "mailer-host.com"
  - field: primary_mx
    match_type: contains
    value: "nickstel.com"
  - field: primary_mx
    match_type: contains
    value: "yurtmail.com"
  - field: primary_mx
