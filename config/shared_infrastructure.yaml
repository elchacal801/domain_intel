      - "mx1.forwardemail.net"
      - "mx2.forwardemail.net"

  mxroute:
    label: "MXRoute"
    category: "email"
    mx_patterns:
      - "*.mxrouting.net"

  rackspace:
    label: "Rackspace Email"
    category: "email"
    mx_patterns:
      - "mx*.emailsrvr.com"

  cloudflare_ns:
    label: "Cloudflare DNS"
    category: "dns"
    ns_patterns:
      - "*.ns.cloudflare.com"

  aws_route53:
    label: "AWS Route 53"
    category: "dns"
    ns_patterns:
      - "ns-*.awsdns-*"

  google_cloud_dns:
    label: "Google Cloud DNS"
    category: "dns"
    ns_patterns:
      - "ns-cloud-*.googledomains.com"

  digitalocean_dns:
    label: "DigitalOcean DNS"
    category: "dns"
    ns_patterns:
      - "ns*.digitalocean.com"

  # Web Hosting / CDN Providers
  cloudflare_cdn:
