name: Slow Drip Whois

on:
  schedule:
    # Run at 04:00 UTC (Distinct from main pipeline at 11:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  whois_enrichment:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          # No heavy deps needed for this script, uses standard lib + socket
          # If we needed requests/pandas etc we would install them here
          echo "No external deps required for drip_whois.py"

      - name: Run Drip Whois
        run: |
          python scripts/drip_whois.py

      - name: Commit Registrar Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/domain_registrars.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Whois Update: $(date +'%Y-%m-%d')" && git push)
