name: Daily Data Update

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual trigger
  push:
    branches: [ "main" ]

jobs:
  update-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. Update Domain Lists (Merge Sources)
      # Fetches fresh data from upstream sources
      run: python scripts/merge_lists_v3b.py --include-stopforumspam

    - name: 2. Enrich Infrastructure (MX/ASN)
      # Resolves new domains to infrastructure
      # Using 50 workers for speed regarding DNS
      run: python scripts/enrich_infrastructure.py --workers 50

    - name: 3. Enrich Reputation (RBL/RDAP)
      # Check Spamhaus/RDAP age
      run: python scripts/enrich_reputation.py --input data/dea_domains_enriched.csv --output data/dea_domains_reputation.csv

    - name: 4. Web Probe (Active Fingerprint)
      # HTTP Grabbing (from Azure IP)
      run: python scripts/probe_web.py --input data/dea_domains_reputation.csv --output data/dea_domains_probed.csv

    - name: 5. Generate Pivots (Stats)
      # Re-calculates top providers/ASNs using the fullest dataset
      run: python scripts/generate_pivots.py --input data/dea_domains_probed.csv

    - name: 6. Infrastructure Intel (ASN/VPN/Tor)
      # Fetches & Enriches suspicious infrastructure lists
      run: |
        python scripts/asn_intel.py
        python scripts/vpn_intel.py
        python scripts/tor_intel.py

    - name: 6.5 Data Hygiene & Enrichment
      # Clean schema and fetch missing ASN names (RIPE/HT)
      run: |
        python scripts/clean_data.py
        python scripts/enrich_asns.py

    - name: 6.7 AI Analysis (Typosquat/Classify/Briefing)
      # Light-weight AI passes if keys are present
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # Only run if keys exist to avoid failure on forks/missing secrets
        if [ ! -z "$GEMINI_API_KEY" ]; then
          python scripts/ai_typosquat.py --limit 500
          python scripts/ai_classify_web.py --limit 500
        fi
        
        if [ ! -z "$OPENAI_API_KEY" ] || [ ! -z "$GEMINI_API_KEY" ]; then
           python scripts/ai_briefing.py
        fi

    - name: 6.8 Sync AI Artifacts
      run: |
        # Move AI outputs to docs/data for dashboard consumption
        cp data/daily_briefing.json docs/data/ || true
        cp data/ai_typosquats.csv docs/data/ || true
        cp data/ai_classifications.csv docs/data/ || true

    - name: 7. Export CTI (STIX 2.1)
      run: python scripts/export_stix.py --input data/dea_domains_probed.csv

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # Sync data to docs/ for the dashboard
        mkdir -p docs/data
        cp data/*.csv docs/data/
        
        # Compress the heavy STIX bundle (exceeds 100MB)
        gzip -f data/domain_intel_bundle.json
        cp data/*.json.gz docs/data/
        
        git add data/*.csv docs/data/*.csv data/*.json.gz docs/data/*.json.gz docs/data/daily_briefing.json
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Automated Data Update: $(date +'%Y-%m-%d')"
          git push
        fi
